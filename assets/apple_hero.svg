<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Deep Space Black & Subtle Radial Glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1d2238" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0c0e17" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Apple Metallic Titanium Gradient -->
    <linearGradient id="titaniumText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Subtle Blue Hue for Accent -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Frosted Glass Pill Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Subtle Glass Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      fill: #818CF8;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1.5px;
      fill: url(#titaniumText);
    }
    .hero-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 21px;
      font-weight: 400;
      letter-spacing: -0.3px;
      fill: #94A3B8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      fill: #E2E8F0;
    }
    .metric-num {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      fill: #64748B;
    }
  </style>

  <!-- Deep Space Canvas -->
  <rect x="0" y="0" width="920" height="380" rx="20" fill="#000000"/>
  <rect x="0" y="0" width="920" height="380" rx="20" fill="url(#spaceGlow)"/>
  <rect x="1" y="1" width="918" height="378" rx="19" fill="none" stroke="url(#glassBorder)" stroke-width="1.2"/>

  <!-- Top Apple Minimalist Brand Tag -->
  <g transform="translate(460, 50)" text-anchor="middle">
    <!-- Apple-style subtle logo dot or glyph -->
    <circle cx="-135" cy="-4" r="3.5" fill="#818CF8"/>
    <text x="0" y="0" class="eyebrow">INTRODUCING KUNAL CHAUHAN • 2026 EDITION</text>
    <circle cx="135" cy="-4" r="3.5" fill="#818CF8"/>
  </g>

  <!-- Hero Headline -->
  <text x="460" y="122" text-anchor="middle" class="hero-title">
    Engineered for the extraordinary.
  </text>

  <!-- Hero Subtitle -->
  <text x="460" y="162" text-anchor="middle" class="hero-subtitle">
    Supercharged by Agentic AI. Architected with relentless precision.
  </text>

  <!-- Apple Pill Chips Row -->
  <g transform="translate(460, 215)" text-anchor="middle">
    <!-- Pill 1 -->
    <g transform="translate(-295, 0)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
      <text x="67.5" y="21.5" class="pill-text">Design in Palampur</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-145, 0)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
      <text x="67.5" y="21.5" class="pill-text">B.Tech CSE @ HPTU</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
      <text x="72.5" y="21.5" class="pill-text">Agentic Intelligence</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(165, 0)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1"/>
      <text x="67.5" y="21.5" class="pill-text">Full-Stack Core</text>
    </g>
  </g>

  <!-- Bottom Divider Line Inside Hero -->
  <line x1="80" y1="285" x2="840" y2="285" stroke="url(#glassBorder)" stroke-width="1"/>

  <!-- Key Specs Ticker (Apple Hardware Style) -->
  <g transform="translate(150, 315)">
    <text x="0" y="18" class="metric-num">64-Bit</text>
    <text x="0" y="38" class="metric-label">High-Performance Core</text>
  </g>

  <g transform="translate(370, 315)">
    <text x="0" y="18" class="metric-num">0 ms</text>
    <text x="0" y="38" class="metric-label">Dropped Frame Target</text>
  </g>

  <g transform="translate(580, 315)">
    <text x="0" y="18" class="metric-num">100%</text>
    <text x="0" y="38" class="metric-label">Typed &amp; Modular</text>
  </g>

  <g transform="translate(750, 315)">
    <text x="0" y="18" class="metric-num">∞</text>
    <text x="0" y="38" class="metric-label">Curiosity Engine</text>
  </g>
</svg>
