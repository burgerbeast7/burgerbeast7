<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181424"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121a24"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e1c"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="textWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <style>
    .bento-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .bento-heading {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
      fill: url(#textWhite);
    }
    .bento-desc {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.5;
      fill: #94A3B8;
    }
    .bento-tags {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #64748B;
    }
  </style>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="920" height="460" rx="20" fill="#000000"/>

  <!-- ============================================== -->
  <!-- CARD 1: NEURAL ENGINE (TOP-LEFT)              -->
  <!-- ============================================== -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="440" height="215" rx="16" fill="url(#cardGrad1)" stroke="url(#cardBorder)" stroke-width="1.2"/>
    <text x="32" y="44" class="bento-eyebrow" fill="#818CF8">NEURAL ARCHITECTURE</text>
    <text x="32" y="82" class="bento-heading">Autonomous Agent Swarms.</text>
    <text x="32" y="118" class="bento-desc">
      Orchestrating multi-agent systems that plan, reason,
    </text>
    <text x="32" y="138" class="bento-desc">
      and execute complex end-to-end cognitive workflows.
    </text>
    <text x="32" y="180" class="bento-tags">
      LangGraph • RAG Pipelines • Vector Embeddings • Python
    </text>
    <!-- Silicon Badge Graphic -->
    <rect x="360" y="28" width="48" height="48" rx="10" fill="#1e1b4b" stroke="#818CF8" stroke-width="1"/>
    <text x="384" y="58" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="14" font-weight="900" fill="#818CF8">AI</text>
  </g>

  <!-- ============================================== -->
  <!-- CARD 2: CONCURRENCY SILICON (TOP-RIGHT)       -->
  <!-- ============================================== -->
  <g transform="translate(470, 10)">
    <rect x="0" y="0" width="440" height="215" rx="16" fill="url(#cardGrad2)" stroke="url(#cardBorder)" stroke-width="1.2"/>
    <text x="32" y="44" class="bento-eyebrow" fill="#F472B6">HARDWARE ACCELERATION</text>
    <text x="32" y="82" class="bento-heading">Microsecond Concurrency.</text>
    <text x="32" y="118" class="bento-desc">
      Harnessing Go goroutines and FastAPI async loops
    </text>
    <text x="32" y="138" class="bento-desc">
      to deliver unyielding throughput under extreme load.
    </text>
    <text x="32" y="180" class="bento-tags">
      Go (Golang) • Channels • FastAPI • WebSockets • Redis
    </text>
    <!-- Speed Icon Graphic -->
    <rect x="360" y="28" width="48" height="48" rx="10" fill="#3b0764" stroke="#F472B6" stroke-width="1"/>
    <text x="384" y="58" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="14" font-weight="900" fill="#F472B6">⚡</text>
  </g>

  <!-- ============================================== -->
  <!-- CARD 3: LIQUID RETINA DISPLAY (BOTTOM-LEFT)   -->
  <!-- ============================================== -->
  <g transform="translate(10, 235)">
    <rect x="0" y="0" width="440" height="215" rx="16" fill="url(#cardGrad3)" stroke="url(#cardBorder)" stroke-width="1.2"/>
    <text x="32" y="44" class="bento-eyebrow" fill="#38BDF8">LIQUID RETINA INTERFACE</text>
    <text x="32" y="82" class="bento-heading">Fluid 60fps Micro-interactions.</text>
    <text x="32" y="118" class="bento-desc">
      Crafting responsive, tactile web interfaces with
    </text>
    <text x="32" y="138" class="bento-desc">
      obsessive attention to typography, motion, and contrast.
    </text>
    <text x="32" y="180" class="bento-tags">
      React • Next.js • TypeScript • TailwindCSS • Vite
    </text>
    <!-- Display Graphic -->
    <rect x="360" y="28" width="48" height="48" rx="10" fill="#0c4a6e" stroke="#38BDF8" stroke-width="1"/>
    <text x="384" y="58" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="14" font-weight="900" fill="#38BDF8">UI</text>
  </g>

  <!-- ============================================== -->
  <!-- CARD 4: CLOUD & ENTERPRISE (BOTTOM-RIGHT)     -->
  <!-- ============================================== -->
  <g transform="translate(470, 235)">
    <rect x="0" y="0" width="440" height="215" rx="16" fill="url(#cardGrad4)" stroke="url(#cardBorder)" stroke-width="1.2"/>
    <text x="32" y="44" class="bento-eyebrow" fill="#34D399">ENTERPRISE RESILIENCE</text>
    <text x="32" y="82" class="bento-heading">Mission-Critical Scalability.</text>
    <text x="32" y="118" class="bento-desc">
      Isolated containerization and cloud orchestration
    </text>
    <text x="32" y="138" class="bento-desc">
      built to withstand real-world enterprise conditions.
    </text>
    <text x="32" y="180" class="bento-tags">
      Docker • AWS (EC2/S3) • PostgreSQL • Linux • CI/CD
    </text>
    <!-- Cloud Graphic -->
    <rect x="360" y="28" width="48" height="48" rx="10" fill="#064e3b" stroke="#34D399" stroke-width="1"/>
    <text x="384" y="58" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="14" font-weight="900" fill="#34D399">☁️</text>
  </g>
</svg>
