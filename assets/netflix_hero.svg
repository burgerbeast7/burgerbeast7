<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <!-- Cinematic Dark Gradient Background -->
    <radialGradient id="cinematicGlow" cx="20%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2a0808" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#141414" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Netflix Red Gradient -->
    <linearGradient id="netflixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#B81D24"/>
    </linearGradient>

    <!-- Play Button Fill -->
    <linearGradient id="whiteBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5E5"/>
    </linearGradient>

    <!-- Translucent Button Fill -->
    <linearGradient id="translucentBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#374151" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -1.5px;
      fill: #FFFFFF;
      text-transform: uppercase;
    }
    .series-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      fill: #E50914;
    }
    .match-rate {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 800;
      fill: #46D369;
    }
    .meta-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      fill: #A3A3A3;
    }
    .synopsis {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.55;
      fill: #E5E5E5;
    }
    .cast-text {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", sans-serif;
      font-size: 12.5px;
      fill: #737373;
    }
    .btn-text-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 800;
      fill: #000000;
    }
    .btn-text-light {
      font-family: -apple-system, BlinkMacSystemFont, "Netflix Sans", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <!-- Canvas Frame -->
  <rect x="0" y="0" width="940" height="400" rx="16" fill="#000000"/>
  <rect x="0" y="0" width="940" height="400" rx="16" fill="url(#cinematicGlow)"/>
  <rect x="1" y="1" width="938" height="398" rx="15" fill="none" stroke="#262626" stroke-width="1.2"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(45, 42)">
    <!-- Iconic Netflix 'N' Logo Ribbon -->
    <g transform="translate(0, -12)">
      <rect x="0" y="0" width="7" height="28" fill="#B81D24"/>
      <rect x="17" y="0" width="7" height="28" fill="#B81D24"/>
      <polygon points="0,0 7,0 24,28 17,28" fill="#E50914"/>
    </g>

    <!-- Netflix Navigation Links -->
    <text x="42" y="7" font-family="'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="700" fill="#E5E5E5" letter-spacing="1">
      ORIGINAL DEVELOPER SERIES
    </text>

    <!-- Top Right: Live Stream Badge -->
    <g transform="translate(740, -6)">
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#E50914"/>
      <circle cx="15" cy="12" r="3.5" fill="#FFFFFF"/>
      <text x="58" y="16.5" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TOP 10 TODAY</text>
    </g>
  </g>

  <!-- Hero Title Area -->
  <g transform="translate(45, 105)">
    <!-- Eyebrow: N SERIES -->
    <text x="0" y="0" class="series-tag">
      ★ N E T F L I X &#160; O R I G I N A L
    </text>

    <!-- Main Title: KUNAL CHAUHAN -->
    <text x="0" y="44" class="brand-title">
      KUNAL CHAUHAN
    </text>

    <!-- Metadata Badges Bar -->
    <g transform="translate(0, 72)">
      <!-- 99% Match -->
      <text x="0" y="13" class="match-rate">99% Match</text>
      
      <!-- Year -->
      <text x="96" y="13" class="meta-tag">2026</text>
      
      <!-- Maturity Rating Box -->
      <rect x="142" y="-1" width="62" height="18" rx="2" fill="none" stroke="#666666" stroke-width="1"/>
      <text x="173" y="12.5" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="10.5" font-weight="700" fill="#E5E5E5">TV-PRO</text>
      
      <!-- Seasons Duration -->
      <text x="216" y="13" class="meta-tag">4 Seasons (B.Tech CSE)</text>
      
      <!-- Ultra HD 4K Badge -->
      <rect x="382" y="-1" width="32" height="18" rx="2" fill="none" stroke="#666666" stroke-width="1"/>
      <text x="398" y="12.5" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="800" fill="#E5E5E5">4K</text>
      
      <!-- HDR Badge -->
      <rect x="420" y="-1" width="34" height="18" rx="2" fill="none" stroke="#666666" stroke-width="1"/>
      <text x="437" y="12.5" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="800" fill="#E5E5E5">HDR</text>
      
      <!-- Spatial Audio Badge -->
      <text x="466" y="13" class="meta-tag">5.1 Concurrency</text>
    </g>

    <!-- Synopsis -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" class="synopsis">
        In a tech landscape flooded with cookie-cutter boilerplate, an ambitious full-stack engineer
      </text>
      <text x="0" y="22" class="synopsis">
        harnesses autonomous <tspan fill="#FFFFFF" font-weight="700">Agentic AI swarms</tspan>, high-throughput <tspan fill="#FFFFFF" font-weight="700">Go microservices</tspan>, and tactile
      </text>
      <text x="0" y="44" class="synopsis">
        <tspan fill="#FFFFFF" font-weight="700">React interfaces</tspan> to build resilient, next-generation architectures that ship fast and scale hard.
      </text>
    </g>

    <!-- Netflix Action Buttons -->
    <g transform="translate(0, 185)">
      <!-- Play Button -->
      <rect x="0" y="0" width="145" height="44" rx="6" fill="url(#whiteBtn)"/>
      <polygon points="26,16 26,28 37,22" fill="#000000"/>
      <text x="48" y="28" class="btn-text-dark">Explore</text>

      <!-- More Info Button -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="165" height="44" rx="6" fill="url(#translucentBtn)"/>
        <circle cx="28" cy="22" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
        <text x="28" y="26" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">i</text>
        <text x="50" y="28" class="btn-text-light">Get In Touch</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Starring & Genres Sidebar -->
  <g transform="translate(640, 175)">
    <text x="0" y="0" class="cast-text">
      <tspan fill="#737373">Starring: </tspan>
      <tspan fill="#D4D4D4">Kunal Chauhan, LangGraph, FastAPI</tspan>
    </text>
    <text x="0" y="20" class="cast-text">
      <tspan fill="#737373">Silicon: </tspan>
      <tspan fill="#D4D4D4">Go (Golang), React, TypeScript, Docker</tspan>
    </text>
    <text x="0" y="40" class="cast-text">
      <tspan fill="#737373">Genres: </tspan>
      <tspan fill="#D4D4D4">Agentic AI, High Concurrency, Full-Stack</tspan>
    </text>
    <text x="0" y="60" class="cast-text">
      <tspan fill="#737373">This Show Is: </tspan>
      <tspan fill="#D4D4D4">Visionary, Fast-Paced, Relentless</tspan>
    </text>
  </g>
</svg>
