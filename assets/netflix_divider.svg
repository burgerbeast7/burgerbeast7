<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 32" width="100%" height="32">
  <defs>
    <!-- Netflix Curved Red Arc Gradient -->
    <linearGradient id="redArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E50914" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E50914" stop-opacity="1"/>
      <stop offset="75%" stop-color="#E50914" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="940" height="32" fill="none"/>
  <!-- Glowing Center Area -->
  <ellipse cx="470" cy="16" rx="280" ry="12" fill="url(#arcGlow)"/>
  <!-- Sharp Netflix Arc Line -->
  <path d="M 0 28 Q 470 4 940 28" fill="none" stroke="url(#redArc)" stroke-width="2.5"/>
</svg>
